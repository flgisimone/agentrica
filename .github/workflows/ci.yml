# Controlli di ogni push e pull request: npm run verify e npm run verify:e2e (CONVENTIONS §13.5).
# Nessun deploy da qui. I passi senza il loro file o script si saltano, così la CI regge anche prima di F0.
# ponytail: con un repository privato e GitHub gratuito il merge non si blocca da solo; va verde prima di unire in main.
name: CI

on:
  push:
    branches: [main, develop, "fase/**", "fix/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TZ: Europe/Rome

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Script disponibili
        id: scripts
        run: |
          if [ -f package.json ]; then
            echo "verify=$(node -p "Boolean(require('./package.json').scripts?.verify)")" >> "$GITHUB_OUTPUT"
            echo "e2e=$(node -p "Boolean(require('./package.json').scripts?.['verify:e2e'])")" >> "$GITHUB_OUTPUT"
          fi

      - if: hashFiles('package-lock.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Dipendenze di produzione senza vulnerabilità alte
        if: hashFiles('package-lock.json') != ''
        run: npm audit --omit=dev --audit-level=high

      - if: steps.scripts.outputs.verify == 'true'
        run: npm run verify

      - if: steps.scripts.outputs.e2e == 'true'
        run: npx playwright install --with-deps chromium

      - if: steps.scripts.outputs.e2e == 'true'
        run: npm run verify:e2e

      - if: failure() && steps.scripts.outputs.e2e == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 3
