# Controlli di ogni push e pull request: npm run verify e npm run verify:e2e (CONVENTIONS §13.5). Da F17 qui non c'è
# verify:e2e (il sito e le sue prove sono nel repository agentrica-site): il passo si salta.
# Da F23 i controlli girano su Linux, Mac e Windows: il server e i comandi install, add e init valgono sui tre sistemi.
# Nessun deploy da qui. I passi senza il loro file o script si saltano, così la CI regge anche prima di F0.
# ponytail: con un repository privato e GitHub gratuito il merge non si blocca da solo; va verde prima di unire in main.
name: CI

on:
  push:
    branches: [main, develop, "fase/**", "fix/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TZ: Europe/Rome

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      # Action fissate per SHA, alle stesse versioni di release.yml (SEC-REL-05).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Script disponibili
        id: scripts
        run: |
          if [ -f package.json ]; then
            echo "verify=$(node -p "Boolean(require('./package.json').scripts?.verify)")" >> "$GITHUB_OUTPUT"
            echo "e2e=$(node -p "Boolean(require('./package.json').scripts?.['verify:e2e'])")" >> "$GITHUB_OUTPUT"
          fi

      - if: hashFiles('package-lock.json') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Dipendenze di produzione senza vulnerabilità alte
        if: hashFiles('package-lock.json') != '' && runner.os == 'Linux'
        run: npm audit --omit=dev --audit-level=high

      - if: steps.scripts.outputs.verify == 'true'
        run: npm run verify

      - if: steps.scripts.outputs.e2e == 'true' && runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - if: steps.scripts.outputs.e2e == 'true' && runner.os == 'Linux'
        run: npm run verify:e2e

      - if: failure() && steps.scripts.outputs.e2e == 'true' && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: test-results/
          retention-days: 3
