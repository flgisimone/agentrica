name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.11.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: DATABASE_URL=postgres://postgres:test@localhost:5432/postgres npm run migrate
      - run: npm test

  build:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configurazione di produzione
        run: |
          echo "DATABASE_URL=${{ secrets.PROD_DATABASE_URL }}" >> .env
          echo "PAYMENTS_WEBHOOK_SECRET=${{ secrets.PAYMENTS_WEBHOOK_SECRET }}" >> .env
      - name: Immagine
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build -t ghcr.io/ortofrutta-emilia/magazzino:latest -t ghcr.io/ortofrutta-emilia/magazzino:${{ github.sha }} .
          docker push ghcr.io/ortofrutta-emilia/magazzino --all-tags
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: build-${{ github.sha }}
          path: |
            .env
            deploy/

  deploy:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    needs: build
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: ./deploy/deploy.sh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
