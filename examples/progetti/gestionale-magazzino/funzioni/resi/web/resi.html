<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resi · Ortofrutta Emilia</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>Resi</h1>

    <form id="return-form">
      <label for="order">Ordine</label>
      <input id="order" name="orderId" inputmode="numeric" required>
      <label for="item">Riga dell'ordine</label>
      <input id="item" name="orderItemId" inputmode="numeric" required>
      <label for="qty">Quantità da rendere</label>
      <input id="qty" name="qty" type="number" min="1" required>
      <label for="amount">Importo da rimborsare (€)</label>
      <input id="amount" name="amount" type="number" step="0.01" required>
      <label for="note">Motivo</label>
      <input id="note" name="note">
      <button type="submit">Apri il reso</button>
    </form>
    <p id="message" role="status"></p>

    <h2>I tuoi resi</h2>
    <ul id="returns"></ul>
  </main>
  <script src="resi.js"></script>
</body>
</html>
