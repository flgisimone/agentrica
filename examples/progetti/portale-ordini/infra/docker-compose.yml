services:
  edge:
    image: nginx:1.27.3-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - uploads:/srv/uploads:ro
    networks: [frontend]
    depends_on: [app, admin]

  app:
    image: registry.ferramentanord.example/portale-ordini:2.4.1
    env_file: .env
    volumes:
      - uploads:/srv/uploads
    networks: [frontend, backend]

  admin:
    image: registry.ferramentanord.example/portale-admin:1.9.0
    env_file: .env
    ports:
      - "8081:8081"
    networks: [frontend, backend]

  db:
    image: postgres:16.6
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend, frontend]

  cache:
    image: redis:7.4.1
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    networks: [backend]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    network_mode: host
    command: ["--web.listen-address=10.8.0.1:9100"]

networks:
  frontend:
  backend:
    internal: true

volumes:
  pgdata:
  uploads:
