worker_processes auto;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  server_tokens off;

  # IP reale del client dal bilanciatore del provider
  set_real_ip_from 0.0.0.0/0;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  log_format main '$remote_addr - [$time_iso8601] "$request" $status $body_bytes_sent "$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  server {
    listen 80;
    server_name ordini.ferramentanord.example;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name ordini.ferramentanord.example;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
      proxy_pass http://app:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location /files/ {
      alias /srv/uploads/;
    }

    location /admin/ {
      allow 10.8.0.0/24;
      deny all;
      proxy_pass http://admin:8081/;
    }

    location = /healthz {
      proxy_pass http://app:3000/healthz;
      access_log off;
    }

    location /metrics {
      proxy_pass http://app:3000/metrics;
    }
  }
}
