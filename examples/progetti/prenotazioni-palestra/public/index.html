<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prenota un corso</title>
  </head>
  <body>
    <h1>Prenota una lezione di prova</h1>
    <form method="post" action="/prenota">
      <p>
        <label for="course">Corso</label>
        <select id="course" name="course" required>
          <option value="yoga">Yoga</option>
          <option value="pilates">Pilates</option>
          <option value="funzionale">Funzionale</option>
        </select>
      </p>
      <p><label for="date">Giorno</label> <input id="date" name="date" type="date" required /></p>
      <p><label for="name">Nome e cognome</label> <input id="name" name="name" required /></p>
      <p><label for="email">Email</label> <input id="email" name="email" type="email" required /></p>
      <p><label for="phone">Telefono</label> <input id="phone" name="phone" type="tel" required /></p>
      <p><label for="taxCode">Codice fiscale</label> <input id="taxCode" name="taxCode" required /></p>
      <p><label for="birthDate">Data di nascita</label> <input id="birthDate" name="birthDate" type="date" required /></p>
      <p>
        <label for="health">Patologie, infortuni o farmaci che l'istruttore deve conoscere</label>
        <textarea id="health" name="health"></textarea>
      </p>
      <p>
        <input id="newsletter" name="newsletter" type="checkbox" value="si" checked />
        <label for="newsletter">Voglio ricevere offerte e novità</label>
      </p>
      <p><button type="submit">Prenota</button></p>
    </form>
  </body>
</html>
