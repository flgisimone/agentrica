# Checks on every push and pull request: npm run verify and npm run verify:e2e (CONVENTIONS §13.5).
# No deploy from here. Steps without their file or script are skipped, so CI holds even before F0.
# ponytail: with a private repository on free GitHub the merge is not blocked automatically; it must be green before merging into main.
name: CI

on:
  push:
    branches: [main, develop, "phase/**", "fix/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TZ: UTC

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions pinned by SHA: a tag can move, a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Available scripts
        id: scripts
        run: |
          if [ -f package.json ]; then
            echo "verify=$(node -p "Boolean(require('./package.json').scripts?.verify)")" >> "$GITHUB_OUTPUT"
            echo "e2e=$(node -p "Boolean(require('./package.json').scripts?.['verify:e2e'])")" >> "$GITHUB_OUTPUT"
          fi

      - if: hashFiles('package-lock.json') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Production dependencies without high vulnerabilities
        if: hashFiles('package-lock.json') != ''
        run: npm audit --omit=dev --audit-level=high

      - if: steps.scripts.outputs.verify == 'true'
        run: npm run verify

      - if: steps.scripts.outputs.e2e == 'true'
        run: npx playwright install --with-deps chromium

      - if: steps.scripts.outputs.e2e == 'true'
        run: npm run verify:e2e

      - if: failure() && steps.scripts.outputs.e2e == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: test-results/
          retention-days: 3
